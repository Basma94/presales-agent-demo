<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presales Agent | Vodafone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --vf-red:#E60000;
  --vf-red-dark:#B10000;
  --vf-red-light:#FFEAEA;
  --vf-dark:#1B1B1B;
  --vf-grey:#5A5D5E;
  --vf-grey-light:#8A8D8E;
  --vf-bg:#F5F6F7;
  --vf-card:#FFFFFF;
  --vf-border:#E5E7E9;
  --vf-green:#0C9B4A;
  --vf-green-bg:#E7F8ED;
  --vf-amber:#B77A00;
  --vf-amber-bg:#FFF4E0;
  --vf-blue:#0A84C7;
  --vf-blue-bg:#E6F4FB;
  --vf-grey-bg:#F0F1F2;
  --vf-purple:#7A4FE6;
  --vf-purple-bg:#F1ECFD;
  --vf-teal:#0E7C86;
  --vf-teal-bg:#E3F5F4;
  --vf-orange:#C1622B;
  --vf-orange-bg:#FDEEDC;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 6px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--vf-bg);
  color:var(--vf-dark);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
/* Safety net: inline icon SVGs with no explicit size would otherwise render at the
   browser's default intrinsic size. More specific rules below override this. */
svg{width:16px;height:16px;flex-shrink:0;}
.pill svg{width:12px;height:12px;}

/* ---------- Layout ---------- */
#app{min-height:100vh;}

.topnav{
  position:fixed;top:0;left:0;right:0;height:64px;background:#fff;
  border-bottom:1px solid var(--vf-border);z-index:100;box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.topnav-inner{max-width:1360px;margin:0 auto;height:100%;display:flex;align-items:center;gap:26px;padding:0 26px;}
.topnav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topnav-brand .mark{
  width:34px;height:34px;border-radius:8px;background:var(--vf-red);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;
}
.topnav-brand .txt{line-height:1.15;}
.topnav-brand .txt b{display:block;font-size:14px;letter-spacing:.1px;}
.topnav-brand .txt span{display:block;font-size:10.5px;color:var(--vf-grey-light);}
.topnav-links{display:flex;gap:4px;flex:1;}
.topnav-link{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--vf-grey);}
.topnav-link svg{width:17px;height:17px;flex-shrink:0;}
.topnav-link:hover{background:var(--vf-grey-bg);color:var(--vf-dark);}
.topnav-link.active{background:var(--vf-red-light);color:var(--vf-red-dark);}
.topnav-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}

.main{padding-top:64px;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--vf-red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;
}
.content{padding:26px;max-width:1280px;width:100%;margin:0 auto;}

/* ---------- Page head ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.page-head h1{font-size:20px;margin:0;font-weight:800;}
.page-head .sub{font-size:12.5px;color:var(--vf-grey);margin-top:3px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--vf-border);
  background:#fff;color:var(--vf-dark);padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:600;
  transition:all .12s;
}
.btn:hover{border-color:#c8cacb;background:#fafafa;}
.btn-primary{background:var(--vf-red);border-color:var(--vf-red);color:#fff;}
.btn-primary:hover{background:var(--vf-red-dark);border-color:var(--vf-red-dark);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--vf-grey-bg);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn svg{width:15px;height:15px;}

/* ---------- Cards ---------- */
.card{background:var(--vf-card);border:1px solid var(--vf-border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px 22px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-head h3{font-size:15px;margin:0;font-weight:700;}
.card-head .hint{font-size:12px;color:var(--vf-grey-light);}

.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}

/* ---------- KPI ---------- */
.kpi{padding:18px 20px;}
.kpi .icon-badge{margin-bottom:12px;}
.kpi .num{font-size:26px;font-weight:800;line-height:1;}
.kpi .lbl{font-size:12.5px;color:var(--vf-grey);margin-top:6px;}
.kpi .delta{font-size:11.5px;margin-top:8px;display:inline-flex;gap:4px;align-items:center;padding:2px 7px;border-radius:5px;}
.kpi-click{cursor:pointer;transition:box-shadow .12s, transform .12s;}
.kpi-click:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.f-row-click{cursor:pointer;border-radius:6px;transition:background .12s;}
.f-row-click:hover{background:#FAFAFA;}
.legend-row-click,.legend-item-click{cursor:pointer;transition:background .12s;}
.legend-row-click:hover,.legend-item-click:hover{background:var(--vf-grey-bg);}
.delta.up{color:var(--vf-green);background:var(--vf-green-bg);}
.delta.flat{color:var(--vf-grey);background:var(--vf-grey-bg);}

/* ---------- Badges / Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.pill-grey{background:var(--vf-grey-bg);color:var(--vf-grey);}
.pill-blue{background:var(--vf-blue-bg);color:var(--vf-blue);}
.pill-amber{background:var(--vf-amber-bg);color:var(--vf-amber);}
.pill-green{background:var(--vf-green-bg);color:var(--vf-green);}
.pill-red{background:var(--vf-red-light);color:var(--vf-red-dark);}
.pill-dark{background:#2A2A2A;color:#fff;}
.pill-teal{background:var(--vf-teal-bg);color:var(--vf-teal);}
.pill-orange{background:var(--vf-orange-bg);color:var(--vf-orange);}
.pill-purple{background:var(--vf-purple-bg);color:var(--vf-purple);}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--vf-grey-bg);color:var(--vf-dark);border:1px solid var(--vf-border);}
.chip-purple{background:var(--vf-purple-bg);color:var(--vf-purple);border-color:#DFD2FA;}

/* ---------- Icon badges (catalogue-card style) ---------- */
.icon-badge{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-badge svg{width:22px;height:22px;}
.icon-badge-sm{width:36px;height:36px;border-radius:9px;}
.icon-badge-sm svg{width:18px;height:18px;}
.icon-badge-red{background:var(--vf-red-light);color:var(--vf-red-dark);}
.icon-badge-blue{background:var(--vf-blue-bg);color:var(--vf-blue);}
.icon-badge-purple{background:var(--vf-purple-bg);color:var(--vf-purple);}
.icon-badge-teal{background:var(--vf-teal-bg);color:var(--vf-teal);}
.icon-badge-green{background:var(--vf-green-bg);color:var(--vf-green);}
.icon-badge-amber{background:var(--vf-amber-bg);color:var(--vf-amber);}
.icon-badge-orange{background:var(--vf-orange-bg);color:var(--vf-orange);}
.icon-badge-grey{background:var(--vf-grey-bg);color:var(--vf-grey);}

/* ---------- Eyebrow / kicker label ---------- */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--vf-red);margin-bottom:6px;}
.chip-red{background:var(--vf-red-light);color:var(--vf-red-dark);border-color:#F7CACA;}

.pega-num{font-family:"SF Mono",Consolas,monospace;font-weight:700;font-size:12.5px;background:var(--vf-grey-bg);padding:3px 9px;border-radius:6px;letter-spacing:.2px;white-space:nowrap;}
.pega-num.pending{background:var(--vf-amber-bg);color:var(--vf-amber);font-family:inherit;font-weight:600;font-style:italic;}

/* ---------- Table-ish list rows ---------- */
.rowlist .row{
  display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--vf-border);
}
.rowlist .row:last-child{border-bottom:none;}
.rowlist .row:hover{background:#FAFAFA;cursor:pointer;}

/* ---------- Opportunity card list (customers grid reuses this) ---------- */
.opp-card{
  padding:16px 18px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:box-shadow .12s, transform .12s;
}
.opp-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.opp-card .oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.opp-card .oc-name{font-weight:700;font-size:14.5px;}
.opp-card .oc-cust{font-size:12.5px;color:var(--vf-grey);margin-top:2px;}
.opp-card .oc-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--vf-grey);margin-top:2px;}
.opp-card .oc-val{font-weight:700;color:var(--vf-dark);}

/* ---------- Opportunities: segmented tabs + toolbar + table ---------- */
.seg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.seg-tab{padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--vf-grey);background:#fff;border:1px solid var(--vf-border);cursor:pointer;display:flex;align-items:center;gap:7px;}
.seg-tab:hover{border-color:#c8cacb;}
.seg-tab.active{background:var(--vf-dark);color:#fff;border-color:var(--vf-dark);}
.seg-tab .seg-count{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;font-size:11px;}
.seg-tab.active .seg-count{background:rgba(255,255,255,.18);}

.opp-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;}

.opp-table{width:100%;border-collapse:collapse;}
.opp-table thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--vf-grey-light);padding:12px 16px;border-bottom:1px solid var(--vf-border);white-space:nowrap;}
.opp-table thead th.sortable{cursor:pointer;user-select:none;}
.opp-table thead th.sortable:hover{color:var(--vf-grey);}
.opp-table tbody td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--vf-border);vertical-align:middle;}
.opp-table tbody tr:last-child td{border-bottom:none;}
.opp-table tbody tr:hover{background:#FAFAFA;cursor:pointer;}
.opp-table tbody td:last-child{width:20px;color:var(--vf-grey-light);}
.opp-table tbody td:last-child svg{width:15px;height:15px;display:block;}

/* ---------- Forms ---------- */
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--vf-grey);margin-bottom:6px;}
.field{margin-bottom:16px;}
.input, textarea.input, select.input{
  width:100%;padding:10px 12px;border:1px solid var(--vf-border);border-radius:8px;font-size:13.5px;background:#fff;color:var(--vf-dark);
}
.input:focus, textarea.input:focus, select.input:focus{outline:none;border-color:var(--vf-red);box-shadow:0 0 0 3px rgba(230,0,0,.08);}
textarea.input{resize:vertical;min-height:70px;}
.field-req::after{content:" *";color:var(--vf-red);}
.field-note{font-size:11.5px;color:var(--vf-grey-light);margin-top:5px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,20,20,.5);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px;
}
.modal{
  background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--vf-border);}
.modal-head h2{font-size:16.5px;margin:0;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--vf-border);display:flex;justify-content:flex-end;gap:10px;}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--vf-grey-bg);display:flex;align-items:center;justify-content:center;color:var(--vf-grey);}
.modal-close:hover{background:#e9e9e9;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--vf-border);margin-bottom:20px;}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--vf-grey);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--vf-red);border-color:var(--vf-red);}
.tab:hover{color:var(--vf-dark);cursor:pointer;}
.tab.locked{opacity:.45;cursor:not-allowed;}

/* ---------- Banner ---------- */
.banner{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:20px;}
.banner-warn{background:var(--vf-amber-bg);border:1px solid #F5D999;}
.banner-red{background:var(--vf-red-light);border:1px solid #F0B7B7;}
.banner-info{background:var(--vf-blue-bg);border:1px solid #B9DEF0;}
.banner-green{background:var(--vf-green-bg);border:1px solid #BFE8CE;}
.banner .b-title{font-weight:700;font-size:13.5px;}
.banner .b-text{font-size:12.5px;color:var(--vf-grey);margin-top:2px;}
.banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px;}

/* ---------- Bar chart ---------- */
.barchart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
.barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.barchart .bar{width:100%;max-width:36px;background:linear-gradient(180deg,var(--vf-red),var(--vf-red-dark));border-radius:5px 5px 2px 2px;position:relative;}
.barchart .bar-val{font-size:10.5px;font-weight:700;margin-bottom:4px;}
.barchart .bar-lbl{font-size:11px;color:var(--vf-grey);margin-top:8px;}

.stackbar{width:100%;max-width:36px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;}
.stackbar > div{width:100%;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--vf-border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--vf-grey);}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

.funnel{display:flex;flex-direction:column;gap:8px;}
.funnel .f-row{display:flex;align-items:center;gap:10px;}
.funnel .f-lbl{width:120px;font-size:12px;color:var(--vf-grey);flex-shrink:0;}
.funnel .f-bar-wrap{flex:1;background:var(--vf-grey-bg);border-radius:6px;height:22px;overflow:hidden;}
.funnel .f-bar{height:100%;background:var(--vf-red);display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:700;border-radius:6px;}
.funnel .f-num{width:26px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0;}

/* ---------- Avatars group ---------- */
.avatar-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;flex-shrink:0;}

/* ---------- Comments ---------- */
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--vf-border);}
.comment:last-child{border-bottom:none;}
.comment .c-body{flex:1;}
.comment .c-head{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.comment .c-name{font-weight:700;}
.comment .c-time{color:var(--vf-grey-light);}
.comment .c-text{font-size:13px;margin-top:4px;line-height:1.5;}
.comment .c-text .mention{color:var(--vf-red);font-weight:700;}
.comment .c-attach{margin-top:6px;}

.mention-menu{position:absolute;background:#fff;border:1px solid var(--vf-border);border-radius:8px;box-shadow:var(--shadow-md);width:220px;max-height:180px;overflow-y:auto;z-index:60;}
.mention-menu .mm-item{padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:8px;}
.mention-menu .mm-item:hover{background:var(--vf-grey-bg);cursor:pointer;}

/* ---------- Documents ---------- */
.doc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--vf-border);border-radius:10px;margin-bottom:8px;}
.doc-icon{width:36px;height:36px;border-radius:8px;background:var(--vf-red-light);color:var(--vf-red-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-icon svg{width:18px;height:18px;}
.doc-name{font-weight:700;font-size:13px;}
.doc-meta{font-size:11.5px;color:var(--vf-grey-light);}
.doc-slot{border:1.5px dashed var(--vf-border);border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.doc-slot .ds-l{display:flex;align-items:center;gap:12px;}
.doc-slot .ds-name{font-weight:700;font-size:13px;}
.doc-slot .ds-desc{font-size:11.5px;color:var(--vf-grey-light);}

/* ---------- Chatbot ---------- */
.chat-fab{
  position:fixed;bottom:26px;right:26px;z-index:150;background:var(--vf-red);color:#fff;border:none;
  width:56px;height:56px;border-radius:50%;box-shadow:0 8px 24px rgba(230,0,0,.35);display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.chat-fab:hover{transform:scale(1.06);}
.chat-fab svg{width:25px;height:25px;}
.chat-panel{
  position:fixed;bottom:96px;right:26px;width:370px;max-width:92vw;height:520px;max-height:75vh;background:#fff;
  border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);z-index:160;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--vf-border);
}
.chat-head{background:var(--vf-dark);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.chat-head .ch-t{font-size:14px;font-weight:700;}
.chat-head .ch-s{font-size:11px;color:#B9BBBC;margin-top:1px;}
.chat-disclaim{font-size:10.5px;color:var(--vf-grey-light);background:var(--vf-grey-bg);padding:7px 12px;text-align:center;}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:12.8px;line-height:1.45;}
.msg.bot{background:var(--vf-grey-bg);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.user{background:var(--vf-red);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.chat-input-wrap{display:flex;gap:8px;padding:12px;border-top:1px solid var(--vf-border);}
.chat-input-wrap input{flex:1;border:1px solid var(--vf-border);border-radius:20px;padding:9px 14px;font-size:13px;}
.chat-input-wrap input:focus{outline:none;border-color:var(--vf-red);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--vf-red);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send svg{width:16px;height:16px;}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
.chat-suggest .sg{font-size:11px;background:#fff;border:1px solid var(--vf-border);padding:5px 10px;border-radius:14px;color:var(--vf-grey);}
.chat-suggest .sg:hover{border-color:var(--vf-red);color:var(--vf-red);}

/* ---------- Misc ---------- */
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--vf-grey);margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--vf-border);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--vf-grey);}
.kv .v{font-weight:600;text-align:right;max-width:60%;}
.empty-state{text-align:center;padding:40px 20px;color:var(--vf-grey-light);}
.empty-state svg{width:46px;height:46px;margin-bottom:10px;opacity:.5;}

/* ---------------------- UTIL ---------------------- */
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function fmtMoney(n){return '€'+Number(n).toLocaleString('en-US');}
function initials(name){return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
const AVATAR_COLORS=['#E60000','#0A84C7','#0C9B4A','#B77A00','#7A4FE6','#0E7C86'];
function colorFor(seed){
  let h=0;for(const c of String(seed)){h=(h*31+c.charCodeAt(0))>>>0;}
  return AVATAR_COLORS[h%AVATAR_COLORS.length];
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

function requestTypeBadge(o){
  if(!o.requestType) return `<span class="pill pill-grey">—</span>`;

/* ---------------------- PEGA NUMBER & SCORING HELPERS ---------------------- */
function generatePegaNumber(){
  const year=appNow().getFullYear();
  const rand=Math.floor(10000+Math.random()*89999);
  return `PEGA-${year}-${rand}`;
}
function oppLabel(o){return o.pegaNumber || 'Pending PEGA Number';}
function computeScoring(o,c){
  const factors=[
    {label:'Strategic Fit',score:60+Math.round(Math.random()*35)},
    {label:'Budget Confirmed',score:40+Math.round(Math.random()*50)},
    {label:'Technical Fit',score:55+Math.round(Math.random()*40)},
    {label:'Competitive Position',score:40+Math.round(Math.random()*45)},
    {label:'Urgency',score:45+Math.round(Math.random()*45)},
  ];
  const overall=Math.round(factors.reduce((s,f)=>s+f.score,0)/factors.length);
  const band= overall>=75?'Hot': overall>=55?'Warm':'Cool';
  return {overall,band,factors};
}
function scoreBandPill(band){
  return {Hot:'pill-green',Warm:'pill-amber',Cool:'pill-grey'}[band]||'pill-grey';
}
function scoreBadge(scoring){
  if(!scoring) return '<span class="pill pill-grey">—</span>';
  return `<span class="pill ${scoreBandPill(scoring.band)}">${scoring.overall} · ${esc(scoring.band)}</span>`;
}
function factorBarColor(score){
  return score>=75?'var(--vf-green)':score>=55?'var(--vf-amber)':'var(--vf-grey-light)';
}

function renderDashboard(){
  const opps=DB.opportunities;
  const active=opps.filter(o=>![WON_STATUS,CANCELLED_STATUS].includes(o.status));
  const won=opps.filter(o=>o.status===WON_STATUS);
  const totalPipeline=pipelineValue(opps);
  const winRate=Math.round(100*won.length/Math.max(1,opps.filter(o=>[WON_STATUS,CANCELLED_STATUS].includes(o.status)).length));

  // Team workload
  const teamRows=DB.team.map(tm=>{
    const mine=opps.filter(o=>o.assignedTo===tm.id);
    const activeMine=mine.filter(o=>![WON_STATUS,CANCELLED_STATUS].includes(o.status));
    const value=pipelineValue(mine);
    return {tm,total:mine.length,active:activeMine.length,value};
  }).sort((a,b)=>b.value-a.value);

  // Lead status funnel
  const funnelStages=['New','Kick off','Discovery','Proposal Development','Proposal Sent','Delivered'];
  const maxCount=Math.max(1,...funnelStages.map(s=>opps.filter(o=>o.status===s).length),opps.filter(o=>o.status===CANCELLED_STATUS).length);

  // Months window (last 6 months incl current)
  const months=[];
  const now=appNow();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:d.getFullYear()+'-'+d.getMonth(),label:d.toLocaleDateString('en-GB',{month:'short'})});
  }

  // Demand Trend by Service Requested (stacked)
  const allServiceCounts={};
  opps.forEach(o=>o.aiRecommendedServices.forEach(s=>{allServiceCounts[s]=(allServiceCounts[s]||0)+1;}));
  const topServices=Object.entries(allServiceCounts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
  const svcColor={};topServices.forEach(s=>svcColor[s]=colorFor(s));
  const monthData=months.map(m=>{
    const inMonth=opps.filter(o=>{const d=new Date(o.created);return (d.getFullYear()+'-'+d.getMonth())===m.key;});
    const segs=topServices.map(s=>({service:s,count:inMonth.filter(o=>o.aiRecommendedServices.includes(s)).length}));
    const otherCount=inMonth.reduce((sum,o)=>sum+o.aiRecommendedServices.filter(s=>!topServices.includes(s)).length,0);
    return {segs,other:otherCount,total:segs.reduce((s,x)=>s+x.count,0)+otherCount};
  });
  const maxStack=Math.max(1,...monthData.map(m=>m.total));
  const hasOtherServices=Object.keys(allServiceCounts).length>topServices.length;

  // AI recommended services aggregate (current active opps) — by pipeline value
  const svcValue={};
  active.forEach(o=>o.aiRecommendedServices.forEach(s=>{svcValue[s]=(svcValue[s]||0)+o.value;}));
  const svcSorted=Object.entries(svcValue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const svcTotal=svcSorted.reduce((s,[,v])=>s+v,0);
  const svcDonutData=svcSorted.map(([s,v])=>({label:s,value:v,color:colorFor(s)}));

  return `
  <div class="grid grid-4" style="margin-bottom:18px;">
    <div class="card kpi kpi-click" data-goactive="1">${iconBadge('briefcase','blue')}<div class="num">${active.length}</div><div class="lbl">Active Opportunities</div></div>
    <div class="card kpi kpi-click" data-goactive="1">${iconBadge('trend','green')}<div class="num">${fmtMoney(totalPipeline)}</div><div class="lbl">Open Pipeline Value</div><span class="delta up">${ic('trend')} Excl. cancelled</span></div>
    <div class="card kpi kpi-click" data-goclosed="1">${iconBadge('check','purple')}<div class="num">${winRate}%</div><div class="lbl">Win Rate</div></div>
    <div class="card kpi kpi-click" data-goscore="Hot">${iconBadge('spark','amber')}<div class="num">${opps.filter(o=>o.profile.scoring&&o.profile.scoring.band==='Hot').length}</div><div class="lbl">Hot Opportunities</div><span class="delta up">High scoring</span></div>
  </div>

  <div class="grid grid-2" style="margin-bottom:18px;">
    <div class="card card-pad">
      <div class="card-head"><h3>Team Workload</h3><span class="hint">By assigned pipeline value</span></div>
      <div class="rowlist">
        ${teamRows.map(r=>`
          <div class="row" data-goassignee="${r.tm.id}">
            ${avatarSm(r.tm.name)}
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:13px;">${esc(r.tm.name)}</div>
              <div style="font-size:11.5px;color:var(--vf-grey-light);">${esc(r.tm.role)} · ${r.active} active / ${r.total} total</div>
            </div>
            <div style="text-align:right;font-weight:700;font-size:13px;">${fmtMoney(r.value)}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card card-pad">
      <div class="card-head"><h3>Lead Status</h3><span class="hint">Opportunity funnel</span></div>
      <div class="funnel">
        ${funnelStages.map(s=>{
          const c=opps.filter(o=>o.status===s).length;
          const pct=Math.round(100*c/maxCount);
          return `<div class="f-row f-row-click" data-gostatus="${esc(s)}">
            <div class="f-lbl">${esc(s)}</div>
            <div class="f-bar-wrap"><div class="f-bar" style="width:${pct}%"></div></div>
            <div class="f-num">${c}</div>

function renderDonutChart(data,size){
  size=size||158;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let cursor=0;
  const stops=data.map(d=>{
    const pct=100*d.value/total;
    const stop=`${d.color} ${cursor}% ${cursor+pct}%`;
    cursor+=pct;
    return stop;
  });
  return `
  <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
    <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops.join(', ')});position:relative;flex-shrink:0;">
      <div style="position:absolute;inset:19%;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
        <div style="font-size:14px;font-weight:800;">${fmtMoney(total)}</div>
        <div style="font-size:9.5px;color:var(--vf-grey-light);">Total Value</div>
      </div>
    </div>
    <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:9px;">
      ${data.map(d=>`
        <div class="legend-row-click" data-goservice="${esc(d.label)}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;padding:4px 6px;margin:-4px -6px;border-radius:6px;">
          <span style="display:flex;align-items:center;gap:7px;min-width:0;"><span class="legend-dot" style="background:${d.color}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.label)}</span></span>
          <span style="font-weight:700;color:var(--vf-grey);white-space:nowrap;">${fmtMoney(d.value)}</span>
        </div>`).join('')}
    </div>
  </div>
  `;
}

/* ================= INSIGHTS ================= */
/* Every new input on an opportunity (an uploaded document, a posted comment) feeds this
   living picture — CHAMP, then MEDDPICC, a fit-gap view of requirements, and a running
   feed of what changed and why. It replaces "generate a doc, download it, read it later"
   with something that's always current and never has to leave the app to be read. */
const CHAMP_ORDER=['challenges','authority','money','prioritization'];
const CHAMP_LABELS={challenges:'Challenges',authority:'Authority',money:'Money',prioritization:'Prioritization'};
const MEDDPICC_ORDER=['metrics','economicBuyer','decisionCriteria','decisionProcess','paperProcess','identifyPain','champion','competition'];
const MEDDPICC_LABELS={metrics:'Metrics',economicBuyer:'Economic Buyer',decisionCriteria:'Decision Criteria',decisionProcess:'Decision Process',paperProcess:'Paper Process',identifyPain:'Identify Pain',champion:'Champion',competition:'Competition'};

function ensureInsights(o,c){
  if(!o.insights) o.insights=buildLiteInsights(o,c||getCustomer(o.customerId));
  return o.insights;
}
function buildLiteSolutionOptions(o,c){
  const catalog=SERVICE_CATALOG[c.industry]||[];
  const core=o.aiRecommendedServices.length?o.aiRecommendedServices:catalog.slice(0,2);
  if(!core.length) return {options:[],recommended:null};
  const single=[core[0]];
  const full=catalog.length?catalog:core;
  const options=[
    {name:'Targeted Fix',fit:'Partial',services:single,
      summary:`Address the immediate pain point only — ${single.join(', ')}. Fastest to deploy, narrowest scope.`},
    {name:'Recommended Package',fit:'Strong',services:core,
      summary:`Balanced package matched to the stated problem and current qualification signals — ${core.join(', ')}.`},
  ];
  if(full.length>core.length){
    options.push({name:'Full Platform',fit:'Good',services:full,
      summary:`Broader ${c.industry} modernization across the wider capability set — ${full.join(', ')}. Bigger scope, longer-term investment.`});
  }
  const seen=new Set();
  const deduped=options.filter(op=>{const key=op.services.join('|');if(seen.has(key))return false;seen.add(key);return true;});
  const sc=o.profile.scoring;
  return {
    options:deduped,
    recommended:{
      name:'Recommended Package',
      why:`Matches the stated problem${o.profile.problemStatement?' ("'+o.profile.problemStatement+'")':''} with the highest-fit catalogue services identified by scoring${sc?` — ${sc.band} qualification (${sc.overall}/100)`:''}.`
    }
  };
}
function buildLiteInsights(o,c){
  const sc=o.profile.scoring;
  const budgetScore=sc?(sc.factors.find(f=>f.label==='Budget Confirmed')||{}).score:null;
  const urgencyScore=sc?(sc.factors.find(f=>f.label==='Urgency')||{}).score:null;
  const sol=buildLiteSolutionOptions(o,c);
  return {
    meddpiccStarted:false,
    brief:{
      whoTheyAre:[c.overview],
      whyNow:[o.profile.problemStatement||'Not yet captured.'],
      technicalAsk:o.profile.problemStatement||'Not yet captured — pending discovery.',
      ecosystem:[]
    },
    champ:{
      challenges:{status:o.profile.problemStatement?'confirmed':'none',text:o.profile.problemStatement||'Not yet captured.'},
      authority:{status:o.profile.customerContact?'partial':'none',text:o.profile.customerContact?`${o.profile.customerContact} is the known contact; full approval chain not yet confirmed.`:'Not yet identified.'},
      money:{status:budgetScore>=70?'confirmed':(budgetScore?'partial':'none'),text:o.value?`${fmtMoney(o.value)} indicative opportunity value.${budgetScore>=70?' Budget confirmed by customer.':' Budget not yet formally confirmed.'}`:'Not yet scoped.'},
      prioritization:{status:urgencyScore>=70?'confirmed':(urgencyScore?'partial':'none'),text:urgencyScore?`Urgency signal at ${urgencyScore}/100 based on qualification scoring.`:'Not yet assessed.'}
    },
    meddpicc:{metrics:{status:'none',text:''},economicBuyer:{status:'none',text:''},decisionCriteria:{status:'none',text:''},
      decisionProcess:{status:'none',text:''},paperProcess:{status:'none',text:''},identifyPain:{status:'none',text:''},
      champion:{status:'none',text:''},competition:{status:'none',text:''}},
    rtm:[],competitors:[],solutionOptions:sol.options,recommendedSolution:sol.recommended,openItems:[],
    gate:{signal:(o.profile.problemStatement&&o.profile.customerContact)?'Gather CHAMP':'New',confidence:'CHAMP still forming',
      recommendation:'Not enough signal yet to recommend proceeding to Discovery — keep capturing inputs (comments, uploaded documents) to build the CHAMP picture.',
      nextStep:'Capture inputs to build CHAMP'},
    log:[{time:o.created,source:`PEGA ticket ${o.pegaNumber||''} created`,note:'Initial profile extracted from the demand form.'}]
  };
}
function statusRank(s){return {none:0,partial:1,confirmed:2,evidenced:2}[s]||0;}
function recomputeGate(o){
  const ins=o.insights;
  const champConfirmed=CHAMP_ORDER.filter(k=>ins.champ[k].status==='confirmed').length;
  if(!ins.meddpiccStarted){
    ins.gate={signal:champConfirmed>=3?'Proceed to Discovery':'Gather CHAMP',
      confidence:`${champConfirmed}/4 CHAMP confirmed`,
      recommendation:champConfirmed>=3?'Strong CHAMP read — proceed to Discovery.':'CHAMP signals still forming — keep capturing inputs before Discovery.',
      nextStep:'Discovery Call'};
  } else {
    const meddEvidenced=MEDDPICC_ORDER.filter(k=>ins.meddpicc[k].status==='evidenced').length;
    ins.gate={signal:meddEvidenced>=6?'Proceed to Proposal Development':'Continue Qualifying',
      confidence:`${meddEvidenced}/8 MEDDPICC evidenced`,
      recommendation:meddEvidenced>=6?'Strong qualification picture — proceed to Proposal Development.':'Keep gathering MEDDPICC evidence before drafting a proposal.',
      nextStep:meddEvidenced>=6?'Draft Customer Proposal':'Continue Discovery'};
  }
}
function analysisStageInfo(o,ins){
  if(o.status===WON_STATUS){
    return {cls:'banner-green',icon:'check',title:`${o.status} — Deal Delivered`,
      body:'This opportunity has been delivered. The analysis below reflects the qualification record that got it here.',next:null};
  }
  if(o.status===CANCELLED_STATUS){
    return {cls:'banner-red',icon:'ban',title:o.status,
      body:o.cancelReason?`Reason: ${o.cancelReason}`:'This opportunity was cancelled or rejected — no further action recommended.',next:null};
  }
  const proceedSignal=/proceed/i.test(ins.gate.signal);
  return {cls:proceedSignal?'banner-green':'banner-warn',icon:proceedSignal?'trend':'info',
    title:`${o.status} · ${ins.gate.signal}`,body:`${ins.gate.confidence} — ${ins.gate.recommendation}`,next:ins.gate.nextStep};
}
function addInsightFromInput(o,input){
  const ins=ensureInsights(o);
  let target=null,section=null;
  for(const k of CHAMP_ORDER){ if(statusRank(ins.champ[k].status)<2){ target=k;section='champ';break; } }
  if(!target && ins.meddpiccStarted){
    for(const k of MEDDPICC_ORDER){ if(statusRank(ins.meddpicc[k].status)<2){ target=k;section='meddpicc';break; } }
  }
  let note;
  if(target){
    const obj=ins[section][target];
    const wasNone=statusRank(obj.status)===0;
    obj.status=section==='champ'?(wasNone?'partial':'confirmed'):(wasNone?'partial':'evidenced');
    obj.text=obj.text?obj.text+` Updated based on ${input.label}.`:`Signal captured from ${input.label}.`;
    const labels=section==='champ'?CHAMP_LABELS:MEDDPICC_LABELS;
    note=`${section==='champ'?'CHAMP':'MEDDPICC'} · ${labels[target]} → ${obj.status}`;
  } else {
    note='Logged for context — no new qualification signal detected yet.';
  }
  ins.log.unshift({time:appNow().toISOString(),source:input.kind==='upload'?`Document uploaded — ${input.label}`:`Comment posted — "${input.label.length>60?input.label.slice(0,60)+'…':input.label}"`,note});
  recomputeGate(o);
  return note;
}
function insightStatusPill(status){
  const map={confirmed:['pill-green','Confirmed'],evidenced:['pill-green','Evidenced'],partial:['pill-amber','Partial'],none:['pill-grey','Not yet']};
  const [cls,label]=map[status]||map.none;
  return `<span class="pill ${cls}">${label}</span>`;

}

/* ================= ASSESSMENT PACK (embedded + PDF export) ================= */
/* Ported from "Pre-Sales Opportunity Assessment Pack.html" — same fonts (Poppins/DM
   Sans), colors and card layout, driven by live opportunity data instead of blanks.
   Fields with no honest data mapping (Duration, Delivery model, TRL, Margin/Upsell)
   are omitted rather than filled with fabricated values. */
const MEDD_LETTER={metrics:'M',economicBuyer:'E',decisionCriteria:'D',decisionProcess:'D',paperProcess:'P',identifyPain:'I',champion:'C',competition:'C'};
function packStatusColor(status){return {confirmed:'#0F8A8A',evidenced:'#0F8A8A',partial:'#C2670B',none:'#E60000'}[status]||'#9CA3AF';}
function packChampScore(status){return {confirmed:5,partial:3,none:1}[status]||1;}
function packChampLabel(status){return {confirmed:'Strong',partial:'Moderate',none:'Weak'}[status]||'Weak';}
function packMeddScore(status){return {evidenced:5,partial:3,none:0}[status]||0;}
function packDecision(o,ins){
  if(o.status===CANCELLED_STATUS) return {label:'NO GO',color:'#E60000',bg:'#FDF6F6',border:'#F7E4E4',text:o.cancelReason||'Do not proceed at this time.'};
  if(o.status===WON_STATUS) return {label:'GO',color:'#0F8A8A',bg:'#F3FAFA',border:'#DDEEED',text:'Delivered — this decision has already been actioned.'};
  const proceed=/proceed/i.test(ins.gate.signal);
  return proceed
    ? {label:'GO',color:'#0F8A8A',bg:'#F3FAFA',border:'#DDEEED',text:'Proceed with proposal preparation.'}
    : {label:'CONDITIONAL GO',color:'#C2670B',bg:'#FDF9F3',border:'#F0DCC1',text:'Proceed subject to defined conditions.'};
}
function packRadial(score,max,color,size,big){
  size=size||112;
  const r=size/2-(big?9:12), cx=size/2, cy=size/2;
  const circ=2*Math.PI*r;
  const dash=(circ*Math.max(0,Math.min(1,score/max))).toFixed(1);
  const scoreFont=big?23:28, scoreDy=big?4:16, labelDy=big?18:30, labelFont=big?10:11;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EAEAEC" stroke-width="8"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} ${circ.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+scoreDy}" text-anchor="middle" font-family="Poppins, sans-serif" font-size="${scoreFont}" font-weight="700" fill="#0B0C0E">${score}</text>
    <text x="${cx}" y="${cy+labelDy}" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="${labelFont}" font-weight="500" fill="#9CA3AF">/${max}</text>
  </svg>`;
}
function packDots(filled,total,color){
  total=total||5;
  let s='';
  for(let i=0;i<total;i++) s+=`<span style="width:7px;height:7px;border-radius:999px;background:${i<filled?color:'#EDEDEF'};display:inline-block;"></span>`;
  return `<span style="display:inline-flex;gap:3px;">${s}</span>`;
}
function packCard(inner,extra){
  return `<div style="background:#FFFFFF;border:1px solid #E8E8EA;border-radius:16px;padding:22px 24px;box-shadow:0 1px 2px rgba(11,12,14,0.04);${extra||''}">${inner}</div>`;

function generateProposal(oppId,format){
  const o=getOpp(oppId);
  const c=getCustomer(o.customerId);
  const slug=c.name.replace(/[^A-Za-z0-9]+/g,'');
  const suffix=(o.pegaNumber||'').split('-').pop()||uid('v');
  const fileName=`Proposal_${slug}_${suffix}.${format}`;
  toast('Generating proposal...');
  setTimeout(()=>{
    const ok = format==='docx' ? downloadProposalDocx(o,c,fileName) : downloadProposalPptx(o,c,fileName);
    if(!ok) return;
    o.documents.push({id:uid('d'),type:'Customer Proposal',fileName,date:appNow().toISOString(),by:CURRENT_USER.name,source:'generated'});
    saveDB();render();
    toast(`Customer Proposal (.${format}) generated and downloaded.`);
  },900);
}
function downloadProposalDocx(o,c,fileName){
  const sc=o.profile.scoring;
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${esc(c.name)} Proposal</title></head>

    <h2>${esc(c.name)}</h2>
    <p><b>PEGA Number:</b> ${esc(o.pegaNumber)}<br><b>Prepared by:</b> ${esc(CURRENT_USER.name)}<br><b>Date:</b> ${esc(fmtDate(appNow().toISOString()))}</p>
    <h3>Problem Statement</h3>
    <p>${esc(o.profile.problemStatement||'—')}</p>
    <h3>Recommended Services</h3>
    <ul>${o.aiRecommendedServices.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <h3>Opportunity Scoring</h3>
    <p>Overall score: ${sc?sc.overall+' ('+esc(sc.band)+')':'—'}</p>
    <h3>Proposed Investment</h3>
    <p>${o.value?fmtMoney(o.value):'To be confirmed'}</p>
    <h3>About ${esc(c.name)}</h3>
    <p>${esc(c.overview)}</p>
    <h3>Supporting Documents on File</h3>
    <ul>${o.documents.length? o.documents.map(d=>`<li>${esc(d.fileName)} (${esc(d.type)})</li>`).join('') : '<li>None on file</li>'}</ul>
    <h3>Recent Discussion</h3>
    <ul>${o.comments.length? o.comments.slice(-5).reverse().map(cm=>`<li><b>${esc(cm.author)}</b> (${esc(fmtDateTime(cm.time))}): ${esc(cm.text)}</li>`).join('') : '<li>No comments yet</li>'}</ul>
  </body></html>`;
  const blob=new Blob(['﻿',html],{type:'application/msword'});
  triggerDownload(blob,fileName);
  return true;
}
function downloadProposalPptx(o,c,fileName){
  if(typeof PptxGenJS==='undefined'){ toast('PowerPoint library failed to load — check your internet connection and try again.'); return false; }
  const sc=o.profile.scoring;
  const pres=new PptxGenJS();
  const s1=pres.addSlide();
  s1.background={color:'FFFFFF'};
  s1.addText('Customer Proposal',{x:0.5,y:1.6,w:9,h:0.8,fontSize:30,bold:true,color:'E60000'});
  s1.addText(c.name,{x:0.5,y:2.4,w:9,h:0.6,fontSize:20,color:'1B1B1B'});
  s1.addText(`PEGA ${o.pegaNumber} · Prepared by ${CURRENT_USER.name}`,{x:0.5,y:3.0,w:9,h:0.4,fontSize:12,color:'5A5D5E'});
  const s2=pres.addSlide();
  s2.addText('Problem Statement',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:'E60000'});
  s2.addText(o.profile.problemStatement||'—',{x:0.5,y:0.9,w:9,h:2,fontSize:14});
  const s3=pres.addSlide();
  s3.addText('Recommended Services',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:'E60000'});
  s3.addText((o.aiRecommendedServices.length?o.aiRecommendedServices:['No services identified yet']).map(s=>({text:s+'\n',options:{bullet:true,fontSize:14}})),{x:0.5,y:0.9,w:9,h:2});
  const s4=pres.addSlide();
  s4.addText('Opportunity Scoring & Investment',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:'E60000'});
  s4.addText(`Overall score: ${sc?sc.overall+' ('+sc.band+')':'—'}\nProposed investment: ${o.value?fmtMoney(o.value):'TBC'}`,{x:0.5,y:0.9,w:9,h:1.2,fontSize:14});
  const s5=pres.addSlide();
  s5.addText('Supporting Documents & Discussion',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:'E60000'});
  const docLines=(o.documents.length?o.documents.map(d=>`${d.fileName} (${d.type})`):['None on file']);
  const commentLines=(o.comments.length?o.comments.slice(-4).reverse().map(cm=>`${cm.author}: ${cm.text}`):['No comments yet']);
  s5.addText(
    [{text:'Documents on File\n',options:{bold:true,fontSize:13}}]
    .concat(docLines.map(t=>({text:t+'\n',options:{bullet:true,fontSize:11}})))
    .concat([{text:'\nRecent Discussion\n',options:{bold:true,fontSize:13}}])
    .concat(commentLines.map(t=>({text:t+'\n',options:{bullet:true,fontSize:11}}))),
    {x:0.5,y:0.9,w:9,h:4.5,valign:'top'}
  );
  pres.writeFile({fileName});
  return true;
}

    `:`

      ${appr.approvers.map(a=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--vf-border);border-radius:9px;flex-wrap:wrap;">

function requestApproval(oppId){
  const o=getOpp(oppId);
  o.approval={requestedAt:appNow().toISOString(),approvers:APPROVERS.map(a=>({name:a.name,role:a.role,approved:false,approvedAt:null}))};
  if(![WON_STATUS,CANCELLED_STATUS].includes(o.status)){ o.status='Proposal Development'; o.stage='Proposal Development'; }
  saveDB();render();
  toast('Approval requested — email sent to Presales Manager and Financial Approver.');
}
function simulateApprove(oppId,approverName){
  const o=getOpp(oppId);
  if(!o||!o.approval) return;
  const a=o.approval.approvers.find(x=>x.name===approverName);
  if(!a||a.approved) return;
  a.approved=true;a.approvedAt=appNow().toISOString();
  const allApproved=o.approval.approvers.every(x=>x.approved);
  if(allApproved){
    o.status='Proposal Sent';o.stage='Proposal Sent';
    const assignee=getTeamMember(o.assignedTo);
    o.comments.push({id:uid('cm'),author:'System',text:`Proposal approved by ${o.approval.approvers.map(x=>x.name).join(' and ')}. Notification email sent to ${assignee.name} (assigned presales engineer). Status moved to Proposal Sent.`,mentions:[],time:appNow().toISOString(),attachment:null});
    saveDB();render();
    toast(`Proposal fully approved — status updated to Proposal Sent, email sent to ${assignee.name}.`);
  } else {
    saveDB();render();
    toast(`${approverName} approved. Waiting on remaining approver.`);
  }
}

function openModal(html){
  const wrap=document.createElement('div');
  wrap.className='modal-overlay';
  wrap.id='modalOverlay';
  wrap.innerHTML=html;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',e=>{if(e.target===wrap) closeModal();});
}
function closeModal(){const m=document.getElementById('modalOverlay');if(m) m.remove();}

function createOpportunityFromDemandForm(assignedTo,fileName,requestType,tier){
  const c=DB.customers[Math.floor(Math.random()*DB.customers.length)];
  const customerId=c.id;
  const pegaNumber=generatePegaNumber();
  const contact=(c.contacts&&c.contacts[0])?`${c.contacts[0].name} (${c.contacts[0].title})`:'Primary customer contact (TBD)';
  const value=Math.round((800000+Math.random()*4200000)/50000)*50000;
  const newOpp={
    id:uid('o'),pegaNumber,customerId,status:'New',stage:'New',requestType,tier:requestType==='RFI'?tier:null,value,
    created:appNow().toISOString(),assignedTo,demandFormFileName:fileName,
    profile:{
      customerContact:contact,
      problemStatement:`Extracted from PEGA demand form ${pegaNumber}: ${c.name} has flagged an operational gap requiring a presales-led solution. Customer highlighted this as a priority initiative for the current fiscal year.`,
      scoring:null,internalTeam:[assignedTo]
    },
    documents:[{id:uid('d'),type:'PEGA Demand Form',fileName,date:appNow().toISOString(),by:CURRENT_USER.name}],
    comments:[],cancelReason:null,aiRecommendedServices:[],approval:null,scheduledReport:null
  };
  newOpp.profile.scoring=computeScoring(newOpp,c);
  const svcs=SERVICE_CATALOG[c.industry]||[];
  newOpp.aiRecommendedServices=shuffle(svcs).slice(0,2);
  newOpp.insights=buildLiteInsights(newOpp,c);
  DB.opportunities.push(newOpp);
  saveDB();
  return newOpp;
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function topServicesByCount(n){
  const counts={};
  DB.opportunities.forEach(o=>o.aiRecommendedServices.forEach(s=>{counts[s]=(counts[s]||0)+1;}));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
function generatePipelineReportText(){
  const opps=DB.opportunities;
  const byStatus=STATUS_ORDER.map(s=>`${s}: ${opps.filter(o=>o.status===s).length}`).join(', ');
  const pipeline=pipelineValue(opps);
  const won=opps.filter(o=>o.status===WON_STATUS).length;
  const lost=opps.filter(o=>o.status===CANCELLED_STATUS).length;
  const winRate=Math.round(100*won/Math.max(1,won+lost));
  const topValue=opps.slice().sort((a,b)=>b.value-a.value).slice(0,3);
  const topScore=opps.filter(o=>o.profile.scoring).slice().sort((a,b)=>b.profile.scoring.overall-a.profile.scoring.overall).slice(0,3);
  return `<b>Pipeline Status Report</b><br>`
    +`Total opportunities: ${opps.length}. Open pipeline value: ${fmtMoney(pipeline)}. Win rate: ${winRate}%.<br>`
    +`By status — ${esc(byStatus)}.<br>`
    +`Top by value: ${topValue.map(o=>`${esc(oppLabel(o))} (${esc(getCustomer(o.customerId).name)}, ${fmtMoney(o.value)})`).join('; ')}.<br>`
    +`Top by score: ${topScore.map(o=>`${esc(oppLabel(o))} (${esc(getCustomer(o.customerId).name)}, score ${o.profile.scoring.overall})`).join('; ')}.`;
}

function reportFormatButtons(scope,customerId){
  const scopeAttr = customerId? ` data-dlscope="${esc(customerId)}"` : '';
  return `<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
    <button class="btn btn-sm" data-dlreport="xlsx" data-dlreporttype="${esc(scope)}"${scopeAttr}>${ic('doc')} Excel</button>
    <button class="btn btn-sm" data-dlreport="pptx" data-dlreporttype="${esc(scope)}"${scopeAttr}>${ic('doc')} PowerPoint</button>
  </div>`;
}
function buildReportRows(scope,refId){
  let list, titleName=null;
  if(scope==='customer' && refId){ list=oppsForCustomer(refId); titleName=getCustomer(refId).name; }
  else if(scope==='opportunity' && refId){ const o=getOpp(refId); list=o?[o]:[]; titleName=o?o.pegaNumber:null; }
  else { list=DB.opportunities; }
  return {
    title: titleName? `${titleName} Status Report` : 'Pipeline Status Report',
    generated: appNow().toISOString(),
    summary:{
      total:list.length,
      openPipelineValue:pipelineValue(list),
      won:list.filter(o=>o.status===WON_STATUS).length,
      cancelled:list.filter(o=>o.status===CANCELLED_STATUS).length,
    },
    rows:list.map(o=>({
      pega:o.pegaNumber||'—', customer:getCustomer(o.customerId).name, requestType:o.requestType||'—', status:o.status,
      assignedTo:getTeamMember(o.assignedTo).name, value:o.value,
      score:o.profile.scoring?o.profile.scoring.overall:'', band:o.profile.scoring?o.profile.scoring.band:'',
      created:fmtDate(o.created),
    }))
  };
}
function sanitizeFileName(s){return s.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function downloadStatusReport(fmt,scope,custId){
  const data=buildReportRows(scope,custId);
  if(fmt==='xlsx'){
    if(typeof XLSX==='undefined'){ toast('Excel export library failed to load — check your internet connection and try again.'); return; }
    const wsSummary=XLSX.utils.json_to_sheet([
      {Metric:'Total Opportunities',Value:data.summary.total},
      {Metric:'Open Pipeline Value (EUR)',Value:data.summary.openPipelineValue},
      {Metric:'Delivered',Value:data.summary.won},
      {Metric:'Cancelled/Rejected',Value:data.summary.cancelled},
    ]);
    const wsRows=XLSX.utils.json_to_sheet(data.rows.map(r=>({
      'PEGA Number':r.pega,'Customer':r.customer,'Status':r.status,'Assigned To':r.assignedTo,
      'Value (EUR)':r.value||0,'Score':r.score,'Band':r.band,'Created':r.created
    })));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,wsSummary,'Summary');
    XLSX.utils.book_append_sheet(wb,wsRows,'Opportunities');
    XLSX.writeFile(wb,sanitizeFileName(data.title)+'.xlsx');
    toast('Excel status report downloaded.');
  } else if(fmt==='pptx'){
    if(typeof PptxGenJS==='undefined'){ toast('PowerPoint export library failed to load — check your internet connection and try again.'); return; }
    const pres=new PptxGenJS();
    const s1=pres.addSlide();
    s1.background={color:'FFFFFF'};
    s1.addText(data.title,{x:0.5,y:0.4,w:9,h:0.8,fontSize:26,bold:true,color:'E60000'});
    s1.addText(`Generated ${fmtDate(data.generated)}`,{x:0.5,y:1.1,w:9,h:0.4,fontSize:12,color:'5A5D5E'});
    s1.addText(
      `Total Opportunities: ${data.summary.total}\nOpen Pipeline Value: ${fmtMoney(data.summary.openPipelineValue)}\nDelivered: ${data.summary.won}    Cancelled/Rejected: ${data.summary.cancelled}`,
      {x:0.5,y:1.8,w:9,h:1.5,fontSize:14,valign:'top'}
    );
    const s2=pres.addSlide();
    s2.addText('Opportunity Detail',{x:0.5,y:0.3,w:9,h:0.5,fontSize:20,bold:true,color:'E60000'});
    const tableRows=[[
      {text:'PEGA #',options:{bold:true,fill:{color:'F0F1F2'}}},
      {text:'Customer',options:{bold:true,fill:{color:'F0F1F2'}}},
      {text:'Status',options:{bold:true,fill:{color:'F0F1F2'}}},
      {text:'Assigned To',options:{bold:true,fill:{color:'F0F1F2'}}},
      {text:'Value',options:{bold:true,fill:{color:'F0F1F2'}}},
    ]];
    data.rows.forEach(r=>tableRows.push([r.pega,r.customer,r.status,r.assignedTo,r.value?fmtMoney(r.value):'—']));
    s2.addTable(tableRows,{x:0.4,y:0.9,w:9.2,fontSize:9,autoPage:true});
    pres.writeFile({fileName:sanitizeFileName(data.title)+'.pptx'});
    toast('PowerPoint status report downloaded.');
  }
}
function triggerDownload(blob,fileName){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}

function buildCustomReportReply(text){
  const ql=text.toLowerCase();
  const wantsScoring=/scor/i.test(text);
  const wantsDocuments=/document/i.test(text);
  const wantsComments=/comment/i.test(text);
  const wantsAll=/full|everything|all details|complete/i.test(text) || (!wantsScoring&&!wantsDocuments&&!wantsComments);
  const flags={scoring:wantsAll||wantsScoring, documents:wantsAll||wantsDocuments, comments:wantsAll||wantsComments};

  const pegaMatch=text.match(/PEGA-\d{4}-\d+/i);
  if(pegaMatch){
    const o=DB.opportunities.find(x=>x.pegaNumber && x.pegaNumber.toLowerCase()===pegaMatch[0].toLowerCase());
    if(!o) return `I couldn't find an opportunity with PEGA number ${esc(pegaMatch[0])}.`;
    return buildOppCustomReportText(o,flags)+reportFormatButtons('opportunity',o.id);
  }
  const custMatch=DB.customers.find(c=>ql.includes(c.name.toLowerCase()));
  if(custMatch){
    return buildCustomerCustomReportText(custMatch,flags)+reportFormatButtons('customer',custMatch.id);
  }
  return `I couldn't match that to a customer or PEGA number. Try including the exact customer name (e.g. "${esc(DB.customers[0].name)}") or a PEGA number (e.g. "${esc(DB.opportunities[0].pegaNumber)}").`;
}

function chatRespond(q){
  const ql=q.toLowerCase();

  // direct PEGA number lookup, e.g. "PEGA-2025-10432"
  const pegaMatch=q.match(/PEGA-\d{4}-\d+/i);
  if(pegaMatch){
    const o=DB.opportunities.find(x=>x.pegaNumber && x.pegaNumber.toLowerCase()===pegaMatch[0].toLowerCase());
    return o? generateOppReportText(o) : `I couldn't find an opportunity with PEGA number ${esc(pegaMatch[0])}.`;
  }

  const custMatch=DB.customers.find(c=>ql.includes(c.name.toLowerCase()));

  if(custMatch && /report|summary|status/.test(ql)){
    return generateCustomerReportText(custMatch)+reportFormatButtons('customer',custMatch.id);
  }
  if(custMatch && /brief|overview|about|priorit|contact/.test(ql)){
    return `<b>${esc(custMatch.name)}</b> (${esc(custMatch.industry)}) — ${esc(custMatch.overview)} Strategic priorities: ${custMatch.priorities.map(esc).join('; ')||'not documented yet'}.`;
  }
  if(custMatch && /recommend|service/.test(ql)){
    const svcs=SERVICE_CATALOG[custMatch.industry]||[];
    return `Based on ${esc(custMatch.name)}'s industry (${esc(custMatch.industry)}) and company brief, recommended services include: ${svcs.map(esc).join(', ')}.`;
  }
  if(custMatch){
    const opps=oppsForCustomer(custMatch.id);
    return `${esc(custMatch.name)} has ${opps.length} opportunit${opps.length===1?'y':'ies'} on record: ${opps.map(o=>`"${esc(oppLabel(o))}" (${esc(o.status)})`).join(', ')||'none yet'}.`;
  }

  // general pipeline / status report
  if(/report|summary/.test(ql)){
    return generatePipelineReportText()+reportFormatButtons('pipeline');
  }

  // internal expert finder
  if(/expert|specialist|who knows/.test(ql)){
    const allTags=[];
    DB.team.forEach(t=>(t.expertise||[]).forEach(e=>allTags.push({tag:e,member:t})));
    const found=allTags.filter(x=>ql.includes(x.tag.toLowerCase()));
    if(found.length){
      const lines=[...new Set(found.map(f=>`${f.member.name} (${f.member.role} — ${f.tag})`))];
      return `Internal experts matching your query: ${lines.map(esc).join(', ')}.`;
    }
    return `Internal expertise directory: ${DB.team.map(t=>`${esc(t.name)} (${esc(t.role)}) — ${(t.expertise||[]).map(esc).join(', ')}`).join(' | ')}. Try "Find an internal expert for 5G" or "...for Healthcare".`;
  }

  // new / emerging technologies
  if(/new tech|latest tech|emerging|trending|technolog/.test(ql)){
    const top=topServicesByCount(5);
    return top.length? `Emerging services gaining traction across current opportunities: ${top.map(esc).join(', ')}. These reflect the top demand trends on the dashboard.` : 'No service trend data available yet.';
  }

  if(/hot|high scoring|best fit/.test(ql)){
    const list=DB.opportunities.filter(o=>o.profile.scoring&&o.profile.scoring.band==='Hot');
    return list.length? `Hot opportunities (highest scoring): ${list.map(o=>`"${esc(oppLabel(o))}" (${esc(getCustomer(o.customerId).name)}, score ${o.profile.scoring.overall})`).join(', ')}.` : 'No Hot-scored opportunities currently.';
  }
  if(/cancel|reject/.test(ql)){
    const list=DB.opportunities.filter(o=>o.status===CANCELLED_STATUS);
    return list.length? list.map(o=>`"${esc(oppLabel(o))}" was cancelled/rejected — reason: ${esc(o.cancelReason)}`).join(' ') : 'No cancelled/rejected opportunities on record.';
  }
  if(/approv/.test(ql)){
    const pending=DB.opportunities.filter(o=>o.approval && !o.approval.approvers.every(a=>a.approved));
    const approved=DB.opportunities.filter(o=>o.approval && o.approval.approvers.every(a=>a.approved));
    return `Pending approval: ${pending.length? pending.map(o=>`"${esc(oppLabel(o))}"`).join(', ') : 'none'}. Fully approved: ${approved.length? approved.map(o=>`"${esc(oppLabel(o))}"`).join(', ') : 'none'}.`;
  }
  if(/win rate|delivered|pipeline|value/.test(ql)){
    const delivered=DB.opportunities.filter(o=>o.status===WON_STATUS).length;
    const cancelled=DB.opportunities.filter(o=>o.status===CANCELLED_STATUS).length;
    return `Current pipeline value is ${fmtMoney(pipelineValue(DB.opportunities))} across ${DB.opportunities.filter(o=>![WON_STATUS,CANCELLED_STATUS].includes(o.status)).length} open opportunities. Delivered: ${delivered}, Cancelled/Rejected: ${cancelled}.`;
  }
  if(/team|assigned|workload/.test(ql)){
    return `Team members: ${DB.team.map(t=>`${esc(t.name)} (${esc(t.role)})`).join(', ')}. Ask me "who is working on [customer]?" for specifics.`;
  }
  const whoMatch=DB.team.find(t=>ql.includes(t.name.toLowerCase().split(' ')[0]));
  if(whoMatch){
    const mine=DB.opportunities.filter(o=>o.assignedTo===whoMatch.id);
    return `${esc(whoMatch.name)} (${esc(whoMatch.role)}) is assigned to ${mine.length} opportunit${mine.length===1?'y':'ies'}: ${mine.map(o=>`"${esc(oppLabel(o))}"`).join(', ')||'none currently'}.`;
  }
  return `I can help with company briefs, opportunity status (by name or PEGA number), scoring, cancellations, approvals, team workload, internal expertise, emerging technologies, or a full pipeline/customer status report. Try "Generate a status report", "Find an internal expert for Healthcare", or "What's the status of Albion Merchant Bank opportunities?"`;
}

function chatSend(text){
  if(!text.trim()) return;
  window.__chatHistory.push({role:'user',text:esc(text)});
  let reply;
  if(window.__chatPending==='expert_domain'){
    reply=findExpertForDomain(text.trim());
    window.__chatPending=null;
  } else if(window.__chatPending==='custom_report'){
    reply=buildCustomReportReply(text.trim());
    window.__chatPending=null;
  } else {
    reply=chatRespond(text);
  }
  window.__chatHistory.push({role:'bot',text:reply});
  render();
  const chatInput=document.getElementById('chatInput');
  if(chatInput) chatInput.focus();
  const msgs=document.getElementById('chatMsgs');
  if(msgs) msgs.scrollTop=msgs.scrollHeight;
}

/* ================= EVENT WIRING ================= */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>go(el.getAttribute('data-nav'));
  });
  document.querySelectorAll('[data-nav-customer]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();go('customer',el.getAttribute('data-nav-customer'));};
  });
  document.querySelectorAll('[data-navcust]').forEach(el=>{
    el.onclick=()=>go('customer',el.getAttribute('data-navcust'));
  });
  document.querySelectorAll('[data-openopp]').forEach(el=>{
    el.onclick=()=>{ACTIVE_TAB='profile';go('opportunity',el.getAttribute('data-openopp'));};
  });

  const btnNewOpp=document.getElementById('btnNewOpp');
  if(btnNewOpp) btnNewOpp.onclick=openCreateOppModal;

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick=()=>{ ACTIVE_TAB=el.getAttribute('data-tab'); render(); };
  });

  document.querySelectorAll('[data-adddoc]').forEach(el=>{
    el.onclick=()=>openAddDocModal(el.getAttribute('data-adddoc'),el.getAttribute('data-doctype'));
  });
  document.querySelectorAll('[data-gendoc]').forEach(el=>{
    el.onclick=()=>{ openProposalFormatModal(el.getAttribute('data-gendoc')); };
  });
  document.querySelectorAll('[data-dlreport]').forEach(el=>{
    el.onclick=()=>{
      const fmt=el.getAttribute('data-dlreport');
      const scope=el.getAttribute('data-dlreporttype');
      const custId=el.getAttribute('data-dlscope');
      downloadStatusReport(fmt,scope,custId);
    };
  });

  document.querySelectorAll('[data-reqapproval]').forEach(el=>{
    el.onclick=()=>requestApproval(el.getAttribute('data-reqapproval'));
  });
  document.querySelectorAll('[data-approve]').forEach(el=>{
    el.onclick=()=>simulateApprove(el.getAttribute('data-approve'),el.getAttribute('data-approver'));
  });
  document.querySelectorAll('[data-exportpack]').forEach(el=>{
    el.onclick=()=>exportAssessmentPackPdf(el.getAttribute('data-exportpack'));
  });
  document.querySelectorAll('[data-schedulereport]').forEach(el=>{
    el.onclick=()=>openScheduleReportModal(el.getAttribute('data-schedulereport'));
  });
  document.querySelectorAll('[data-cancelschedule]').forEach(el=>{
    el.onclick=()=>cancelScheduledReport(el.getAttribute('data-cancelschedule'));
  });
  document.querySelectorAll('[data-runschedulenow]').forEach(el=>{
    el.onclick=()=>runScheduledReportNow(el.getAttribute('data-runschedulenow'));
  });

  const assignSelect=document.getElementById('assignSelect');
  if(assignSelect) assignSelect.onchange=()=>{
    const o=getOpp(assignSelect.getAttribute('data-oppid'));
    o.assignedTo=assignSelect.value;saveDB();render();toast('Assignee updated.');
  };
  const statusSelect=document.getElementById('statusSelect');
  if(statusSelect) statusSelect.onchange=()=>{
    const oppId=statusSelect.getAttribute('data-oppid');
    const val=statusSelect.value;
    if(val===CANCELLED_STATUS){ openCancelReasonModal(oppId,statusSelect); return; }
    const o=getOpp(oppId);
    o.status=val;o.stage=val;
    if(val!==CANCELLED_STATUS) o.cancelReason=null;
    saveDB();render();toast('Status updated to '+val+'.');
  };

  const btnPostComment=document.getElementById('btnPostComment');
  if(btnPostComment) btnPostComment.onclick=()=>{
    const box=document.getElementById('commentBox');
    const text=box.value.trim();
    if(!text){toast('Write a comment first.');return;}
    const fileInput=document.getElementById('commentAttach');
    const file=fileInput&&fileInput.files[0];
    const o=getOpp(btnPostComment.getAttribute('data-oppid'));
    const mentions=(text.match(/@([A-Za-z]+ ?[A-Za-z]*)/g)||[]).map(m=>m.slice(1).trim());
    o.comments.push({id:uid('cm'),author:CURRENT_USER.name,text,mentions,time:appNow().toISOString(),attachment:file?file.name:null});
    if(file){
      o.documents.push({id:uid('d'),type:'Comment Attachment',fileName:file.name,date:appNow().toISOString(),by:CURRENT_USER.name,source:'uploaded'});
    }
    addInsightFromInput(o,{kind:'comment',label:text});
    saveDB();render();
    toast('Comment posted — Insights updated.'+(mentions.length?` Notified: ${mentions.join(', ')}`:'')+(file?' Attachment also added to Documents.':''));
  };
  const commentBox=document.getElementById('commentBox');
  if(commentBox){
    commentBox.addEventListener('input',()=>{
      const val=commentBox.value;
      const caret=commentBox.selectionStart;
      const upto=val.slice(0,caret);
      const m=upto.match(/@([A-Za-z]*)$/);
      const menu=document.getElementById('mentionMenu');
      if(m){
        const term=m[1].toLowerCase();
        const matches=DB.team.filter(t=>t.name.toLowerCase().includes(term));
        if(matches.length){
          menu.innerHTML=`<div class="mention-menu" style="top:4px;left:0;">${matches.map(t=>`<div class="mm-item" data-mname="${esc(t.name)}">${avatarSm(t.name)} ${esc(t.name)}</div>`).join('')}</div>`;
          menu.style.position='relative';
          menu.querySelectorAll('[data-mname]').forEach(mm=>{
            mm.onclick=()=>{
              const name=mm.getAttribute('data-mname');
              commentBox.value=val.slice(0,caret-m[0].length)+'@'+name+' '+val.slice(caret);
              menu.innerHTML='';
              commentBox.focus();
            };
          });
        } else { menu.innerHTML=''; }
      } else { menu.innerHTML=''; }
    });
  }
  const commentAttach=document.getElementById('commentAttach');
  if(commentAttach) commentAttach.onchange=()=>{
    const nameEl=document.getElementById('commentAttachName');
    if(commentAttach.files[0]) nameEl.textContent=commentAttach.files[0].name;
  };

  // opportunities page: segmented status tabs
  document.querySelectorAll('[data-setstatus]').forEach(el=>{
    el.onclick=()=>{
      window.__oppFilter=Object.assign({},window.__oppFilter,{status:el.getAttribute('data-setstatus')||''});
      render();
    };
  });
  const btnClearFilters=document.getElementById('btnClearFilters');
  if(btnClearFilters) btnClearFilters.onclick=()=>{ window.__oppFilter={}; render(); };

  // dashboard: clickable cards / rows drilling into a filtered Opportunities view
  document.querySelectorAll('[data-goactive]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={excludeStatuses:[WON_STATUS,CANCELLED_STATUS]}; go('opportunities'); };
  });
  document.querySelectorAll('[data-goclosed]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={statusIn:[WON_STATUS,CANCELLED_STATUS]}; go('opportunities'); };
  });
  document.querySelectorAll('[data-goscore]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={scoreBand:el.getAttribute('data-goscore')}; go('opportunities'); };
  });
  document.querySelectorAll('[data-goassignee]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={assignedTo:el.getAttribute('data-goassignee')}; go('opportunities'); };
  });
  document.querySelectorAll('[data-gostatus]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={status:el.getAttribute('data-gostatus')}; go('opportunities'); };
  });
  document.querySelectorAll('[data-goservice]').forEach(el=>{
    el.onclick=()=>{ window.__oppFilter={service:el.getAttribute('data-goservice')}; go('opportunities'); };
  });

  // opportunities page: assignee filter
  const fAssignee=document.getElementById('fAssignee');
  if(fAssignee) fAssignee.onchange=()=>{window.__oppFilter=Object.assign({},window.__oppFilter,{assignedTo:fAssignee.value});render();};
  const fRequestType=document.getElementById('fRequestType');
  if(fRequestType) fRequestType.onchange=()=>{window.__oppFilter=Object.assign({},window.__oppFilter,{requestType:fRequestType.value});render();};
  // opportunities page: local search (preserves caret across re-render)
  const oppSearch=document.getElementById('oppSearch');
  if(oppSearch) oppSearch.oninput=()=>{
    const caret=oppSearch.selectionStart;
    window.__oppFilter=Object.assign({},window.__oppFilter,{text:oppSearch.value});
    render();
    const ns=document.getElementById('oppSearch');
    if(ns){ns.focus();ns.setSelectionRange(caret,caret);}
  };
  // opportunities page: sortable columns
  document.querySelectorAll('.opp-table thead th.sortable').forEach(th=>{
    th.onclick=()=>{
      const key=th.getAttribute('data-sort');
      const cur=window.__oppSort||{key:'created',dir:'desc'};
      const dir = cur.key===key ? (cur.dir==='asc'?'desc':'asc') : 'desc';
      window.__oppSort={key,dir};
      render();
    };
  });

  // global search (top nav) -> jumps to Opportunities with filter applied
  const gs=document.getElementById('globalSearch');
  if(gs) gs.onkeydown=(e)=>{
    if(e.key==='Enter'){
      window.__oppFilter=Object.assign({},window.__oppFilter,{text:gs.value});
      go('opportunities');
    }
  };

  // chatbot
  const chatFab=document.getElementById('chatFab');
  if(chatFab) chatFab.onclick=()=>{window.__chatOpen=!window.__chatOpen;render();
    setTimeout(()=>{const i=document.getElementById('chatInput');if(i)i.focus();
      const msgs=document.getElementById('chatMsgs');if(msgs) msgs.scrollTop=msgs.scrollHeight;},0);
  };
  const chatClose=document.getElementById('chatClose');
  if(chatClose) chatClose.onclick=(e)=>{e.stopPropagation();window.__chatOpen=false;render();};
  const chatSendBtn=document.getElementById('chatSend');
  const chatInput=document.getElementById('chatInput');
  if(chatSendBtn) chatSendBtn.onclick=()=>{chatSend(chatInput.value);chatInput.value='';};
  if(chatInput) chatInput.onkeydown=(e)=>{if(e.key==='Enter'){chatSend(chatInput.value);chatInput.value='';}};
  document.querySelectorAll('.sg').forEach(el=>{
    el.onclick=()=>{
      const q=el.getAttribute('data-q');
      if(q==='Find internal expert'){ askExpertDomain(); }
      else if(q==='Customized report'){ askCustomReport(); }
      else { chatSend(q); }
    };
  });
}

/* ================= INIT ================= */
render();
</script>
